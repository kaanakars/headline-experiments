[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "headline-experiments"
version = "0.1.0"
description = "What sells political and business news? 32,487 real headline A/B tests from Upworthy"
authors = [{ name = "Kaan Akar" }]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "statsmodels>=0.14",
    "vaderSentiment>=3.3.2",
]

[project.scripts]
headline-lab-label-sample = "headline_lab.labels:main"

[project.optional-dependencies]
dev = ["pytest>=7.4", "ruff>=0.4"]
analysis = ["matplotlib>=3.7", "jupyter"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
headline_lab = ["lexicons/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["headline_lab"]
